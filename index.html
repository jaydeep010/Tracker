<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TrackJack Pro</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap');

        :root {
            --bg-base: #030305;
            --glass-bg: rgba(18, 18, 24, 0.65);
            --glass-border: rgba(255, 255, 255, 0.04);
            --text-main: #ffffff;
            --text-muted: #7c7c8c;
            
            --glow-gaming: rgba(0, 195, 255, 0.25);
            --glow-story: rgba(187, 0, 255, 0.25);
            --glow-vlog: rgba(255, 149, 0, 0.25);
            --glow-admin: rgba(255, 255, 255, 0.15);
            --glow-spend: rgba(255, 45, 85, 0.3);
            --glow-bonus: rgba(48, 209, 88, 0.3);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(26, 26, 36, 0.5) 0%, rgba(3, 3, 5, 1) 75%),
                radial-gradient(circle at 0% 100%, rgba(15, 15, 25, 0.4) 0%, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            margin: 0;
            padding: 180px 20px 80px 20px;
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            box-sizing: border-box;
        }

        /* --- IMMERSIVE TOUCH CANVAS LAYER --- */
        #touch-glow-aura {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
            mix-blend-mode: screen;
            opacity: 0;
            transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            background: radial-gradient(100px circle at 0px 0px, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.05) 30%, transparent 100%);
        }

        /* --- STICKY HEADER --- */
        .header-pin {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 25px 20px 15px 20px;
            background: linear-gradient(to bottom, #030305 80%, rgba(3, 3, 5, 0) 100%);
            z-index: 1000;
            display: flex;
            justify-content: center;
            box-sizing: border-box;
        }

        .bucket-container {
            background: rgba(12, 12, 16, 0.7);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 24px;
            padding: 16px 30px;
            text-align: center;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 24px 50px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255,255,255,0.1);
            transform: translateY(-20px);
            opacity: 0;
            animation: slideDown 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .bucket-container h2 {
            margin: 0;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .bucket-container h1 {
            font-size: 3.2rem;
            margin: 4px 0 0 0;
            font-weight: 900;
            letter-spacing: -2px;
            background: linear-gradient(180deg, #ffffff 40%, #c3c3d1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .pop-animation {
            transform: scale(1.08) !important;
            filter: drop-shadow(0 0 20px rgba(76, 217, 100, 0.6));
        }

        /* --- SECTION STRUCTURES --- */
        .section-wrapper {
            width: 100%;
            max-width: 500px;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .section-wrapper:nth-child(2) { animation-delay: 0.1s; }
        .section-wrapper:nth-child(3) { animation-delay: 0.2s; }
        .section-wrapper:nth-child(4) { animation-delay: 0.3s; }
        .section-wrapper:nth-child(5) { animation-delay: 0.4s; }
        .section-wrapper:nth-child(6) { animation-delay: 0.5s; }

        .section-title {
            font-size: 0.95rem;
            font-weight: 800;
            margin: 40px 0 16px 4px;
            letter-spacing: 2px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .section-title::after {
            content: '';
            flex-grow: 1;
            height: 1px;
            background: linear-gradient(to right, rgba(255,255,255,0.1), transparent);
        }

        .title-gaming { color: #00c3ff; }
        .title-story { color: #bb00ff; }
        .title-vlog { color: #ff9500; }
        .title-admin { color: #ffffff; }
        .title-spend { color: #ff2d55; }

        .grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        /* --- TASK ELEMENTS --- */
        button {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            color: rgba(255, 255, 255, 0.85);
            padding: 18px 24px;
            border-radius: 18px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            box-sizing: border-box;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
            touch-action: manipulation;
        }

        button .btn-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s;
        }

        button span.time {
            font-size: 0.8rem;
            color: var(--text-main);
            font-weight: 700;
            background: rgba(255, 255, 255, 0.06);
            padding: 6px 14px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        /* --- SHIELD CONFIRMATION ENGINE OVERLAY --- */
        button .confirm-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            opacity: 0;
            pointer-events: none;
            transform: translateY(100%);
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        button.confirming .btn-content {
            transform: translateY(-100%);
            opacity: 0;
        }

        button.confirming .confirm-overlay {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        .confirm-choice {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: background 0.2s;
        }

        .choice-yes { background: rgba(48, 209, 88, 0.15); color: #30d158; border-right: 1px solid rgba(255,255,255,0.05); }
        .choice-yes:active { background: rgba(48, 209, 88, 0.3); }
        .choice-no { background: rgba(255, 45, 85, 0.12); color: #ff2d55; }
        .choice-no:active { background: rgba(255, 45, 85, 0.25); }

        /* Hover Mechanics for Desktop Only */
        @media (hover: hover) {
            button:hover {
                color: #ffffff;
                background: rgba(25, 25, 35, 0.8);
                border-color: rgba(255, 255, 255, 0.15);
                transform: translateX(4px);
            }
            .btn-gaming:hover { box-shadow: -4px 0 20px var(--glow-gaming); border-left: 2px solid #00c3ff; }
            .btn-story:hover { box-shadow: -4px 0 20px var(--glow-story); border-left: 2px solid #bb00ff; }
            .btn-vlog:hover { box-shadow: -4px 0 20px var(--glow-vlog); border-left: 2px solid #ff9500; }
            .btn-admin:hover { box-shadow: -4px 0 20px var(--glow-admin); border-left: 2px solid #ffffff; }
            .btn-spend:hover { box-shadow: -4px 0 20px var(--glow-spend); border-left: 2px solid #ff2d55; }
            .bonus-btn:hover { box-shadow: -4px 0 20px var(--glow-bonus); border-left: 2px solid #30d158; }
        }

        /* --- BUTTON ACCENTS --- */
        .bonus-btn { background: linear-gradient(90deg, rgba(48,209,88,0.06), rgba(18,18,24,0.6)); border-color: rgba(48,209,88,0.15); }
        .bonus-btn span.time { color: #30d158; background: rgba(48,209,88,0.1); border-color: rgba(48,209,88,0.2); }

        .btn-spend { background: linear-gradient(90deg, rgba(255,45,85,0.04), rgba(18,18,24,0.6)); border-color: rgba(255,45,85,0.12); }
        .btn-spend span.time { color: #ff2d55; background: rgba(255,45,85,0.1); border-color: rgba(255,45,85,0.2); }

        @keyframes slideDown { to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeUp { to { transform: translateY(0); opacity: 1; } }

        @media (max-width: 480px) {
            body { padding-top: 155px; padding-left: 12px; padding-right: 12px; }
            .bucket-container h1 { font-size: 2.8rem; }
            button { padding: 16px 18px; font-size: 0.95rem; }
        }
    </style>
</head>
<body>

        <div class="section-title title-spend" style="margin-top: 40px;">Rewards & Spending</div>

                <div class="btn-content">FINAL VIDEO EXPORT <span class="time">+2h</span></div>
                <div class="confirm-overlay"><div class="confirm-choice choice-yes" onclick="confirmAction(event, this, 'add', 120)">Confirm ✓</div><div class="confirm-choice choice-no" onclick="cancelAction(event, this)">Cancel ✕</div></div>

                <div class="btn-content">:( <span class="time">-3h</span></div>
                <div class="confirm-overlay"><div class="confirm-choice choice-yes" onclick="confirmAction(event, this, 'subtract', 180)">Confirm ✓</div><div class="confirm-choice choice-no" onclick="cancelAction(event, this)">Cancel ✕</div></div>

    <script>
        let totalMinutes = localStorage.getItem("timeBucketPro") ? parseInt(localStorage.getItem("timeBucketPro")) : 0;
        const scoreElement = document.getElementById("scoreDisplay");
        const aura = document.getElementById("touch-glow-aura");
        let activeShieldTimeout = null;

        // Web Audio API Synthesizer Context
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        /* --- CLASSIC 8-BIT SQUARE WAVE CHIPTUNE ENGINE --- */
        function playCoinSound() {
            initAudio();
            if (!audioCtx) return;
            
            let now = audioCtx.currentTime;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            
            osc.type = 'square'; // Raw retro chiptune architecture
            
            // Icon 3-stage classic arpeggio coin chime sequence
            osc.frequency.setValueAtTime(523.25, now); // C5
            osc.frequency.setValueAtTime(659.25, now + 0.06); // E5
            osc.frequency.setValueAtTime(987.77, now + 0.12); // B5 (bright finish)
            
            gain.gain.setValueAtTime(0.06, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.35);
        }

        function playSpendSound() {
            initAudio();
            if (!audioCtx) return;

            let now = audioCtx.currentTime;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            
            osc.type = 'square';
            
            // Multi-step cascading descending chip dropout
            osc.frequency.setValueAtTime(440.00, now); // A4
            osc.frequency.setValueAtTime(329.63, now + 0.08); // E4
            osc.frequency.setValueAtTime(220.00, now + 0.16); // A3
            osc.frequency.linearRampToValueAtTime(80.00, now + 0.35); // Hard sub drop
            
            gain.gain.setValueAtTime(0.07, now);
            gain.gain.linearRampToValueAtTime(0.001, now + 0.35);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.35);
        }

        function playCancelSound() {
            initAudio();
            if (!audioCtx) return;

            let now = audioCtx.currentTime;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();

            osc.type = 'square';

            // Clean, quick retro cancellation blip
            osc.frequency.setValueAtTime(329.63, now); // E4
            osc.frequency.setValueAtTime(220.00, now + 0.06); // A3

            gain.gain.setValueAtTime(0.06, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.2);
        }

        function playErrorSound() {
            initAudio();
            if (!audioCtx) return;

            let now = audioCtx.currentTime;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            
            osc.type = 'square';
            
            // Low arcade error buzz tone
            osc.frequency.setValueAtTime(110.00, now);
            osc.frequency.setValueAtTime(90.00, now + 0.07);
            
            gain.gain.setValueAtTime(0.08, now);
            gain.gain.linearRampToValueAtTime(0.001, now + 0.22);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.22);
        }

        function formatTime(mins) {
            let h = Math.floor(mins / 60);
            let m = mins % 60;
            if (h === 0) return `${m}m`;
            if (m === 0) return `${h}h`;
            return `${h}h ${m}m`;
        }

        function updateDisplay(animate = false) {
            scoreElement.innerText = formatTime(totalMinutes);
            localStorage.setItem("timeBucketPro", totalMinutes);
            
            if (animate) {
                scoreElement.classList.remove("pop-animation");
                void scoreElement.offsetWidth;
                scoreElement.classList.add("pop-animation");
                setTimeout(() => scoreElement.classList.remove("pop-animation"), 300);
            }
        }

        /* --- SHIELD CONFIRMATION ENGINE --- */
        function triggerShield(buttonElement) {
            initAudio(); // Captures interaction to instantly wake up audio element context on mobile
            if (buttonElement.classList.contains("confirming")) return;
            
            document.querySelectorAll("button.confirming").forEach(btn => btn.classList.remove("confirming"));
            if (activeShieldTimeout) clearTimeout(activeShieldTimeout);

            buttonElement.classList.add("confirming");
            
            activeShieldTimeout = setTimeout(() => {
                buttonElement.classList.remove("confirming");
            }, 4000);
        }

        function confirmAction(event, element, actionType, mins) {
            event.stopPropagation();
            const parentButton = element.closest("button");
            parentButton.classList.remove("confirming");
            if (activeShieldTimeout) clearTimeout(activeShieldTimeout);

            if (actionType === 'add') {
                if (navigator.vibrate) navigator.vibrate(50); 
                playCoinSound();
                totalMinutes += mins;
                updateDisplay(true);
            } else if (actionType === 'subtract') {
                if (totalMinutes >= mins) {
                    if (navigator.vibrate) navigator.vibrate([30, 50, 30]);
                    playSpendSound();
                    totalMinutes -= mins;
                    scoreElement.style.color = "#ff2d55";
                    updateDisplay(true);
                    setTimeout(() => { scoreElement.style.color = "var(--text-main)"; }, 300);
                } else {
                    if (navigator.vibrate) navigator.vibrate(200);
                    playErrorSound();
                    scoreElement.style.transform = "translateX(-10px)";
                    setTimeout(() => scoreElement.style.transform = "translateX(10px)", 50);
                    setTimeout(() => scoreElement.style.transform = "translateX(-10px)", 100);
                    setTimeout(() => scoreElement.style.transform = "translateX(10px)", 150);
                    setTimeout(() => scoreElement.style.transform = "translateX(0)", 200);
                }
            }
        }

        function cancelAction(event, element) {
            event.stopPropagation();
            const parentButton = element.closest("button");
            parentButton.classList.remove("confirming");
            if (activeShieldTimeout) clearTimeout(activeShieldTimeout);
            if (navigator.vibrate) navigator.vibrate(30);
            playCancelSound();
        }

        /* --- FINGER TRACKING GLOW ENGINE --- */
        function updateGlowPosition(e) {
            const touch = e.touches[0];
            aura.style.opacity = "1";
            aura.style.background = `radial-gradient(120px circle at ${touch.clientX}px ${touch.clientY}px, rgba(255, 255, 255, 0.14) 0%, rgba(255, 255, 255, 0.04) 40%, transparent 100%)`;
        }

        window.addEventListener("touchstart", (e) => {
            updateGlowPosition(e);
        }, { passive: true });

        window.addEventListener("touchmove", (e) => {
            updateGlowPosition(e);
        }, { passive: true });

        window.addEventListener("touchend", () => {
            aura.style.opacity = "0";
        });

        updateDisplay(false);
    </script>
</body>
</html>
