<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TrackJack</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap');

        :root {
            --bg-base: #030305;
            --glass-bg: rgba(18, 18, 24, 0.6);
            --glass-border: rgba(255, 255, 255, 0.04);
            --text-main: #ffffff;
            --text-muted: #7c7c8c;
            
            /* Cinematic Halos */
            --glow-gaming: rgba(0, 195, 255, 0.25);
            --glow-story: rgba(187, 0, 255, 0.25);
            --glow-vlog: rgba(255, 149, 0, 0.25);
            --glow-admin: rgba(255, 255, 255, 0.15);
            --glow-spend: rgba(255, 45, 85, 0.3);
            --glow-bonus: rgba(48, 209, 88, 0.3);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(26, 26, 36, 0.5) 0%, rgba(3, 3, 5, 1) 75%),
                radial-gradient(circle at 0% 100%, rgba(15, 15, 25, 0.4) 0%, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            margin: 0;
            padding: 180px 20px 80px 20px;
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            box-sizing: border-box;
        }

        /* --- STICKY HEADER --- */
        .header-pin {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 25px 20px 15px 20px;
            background: linear-gradient(to bottom, #030305 80%, rgba(3, 3, 5, 0) 100%);
            z-index: 1000;
            display: flex;
            justify-content: center;
            box-sizing: border-box;
        }

        .bucket-container {
            background: rgba(12, 12, 16, 0.7);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 24px;
            padding: 16px 30px;
            text-align: center;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 24px 50px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255,255,255,0.1);
            transform: translateY(-20px);
            opacity: 0;
            animation: slideDown 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            position: relative;
        }

        .bucket-container h2 {
            margin: 0;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .bucket-container h1 {
            font-size: 3.2rem;
            margin: 4px 0 0 0;
            font-weight: 900;
            letter-spacing: -2px;
            background: linear-gradient(180deg, #ffffff 40%, #c3c3d1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .pop-animation {
            transform: scale(1.08) !important;
            filter: drop-shadow(0 0 20px rgba(76, 217, 100, 0.6));
        }

        /* --- TIMELINE SECTION WRAPPERS --- */
        .section-wrapper {
            width: 100%;
            max-width: 500px;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .section-wrapper:nth-child(2) { animation-delay: 0.1s; }
        .section-wrapper:nth-child(3) { animation-delay: 0.2s; }
        .section-wrapper:nth-child(4) { animation-delay: 0.3s; }
        .section-wrapper:nth-child(5) { animation-delay: 0.4s; }
        .section-wrapper:nth-child(6) { animation-delay: 0.5s; }

        .section-title {
            font-size: 0.95rem;
            font-weight: 800;
            margin: 40px 0 16px 4px;
            letter-spacing: 2px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .section-title::after {
            content: '';
            flex-grow: 1;
            height: 1px;
            background: linear-gradient(to right, rgba(255,255,255,0.1), transparent);
        }

        .title-gaming { color: #00c3ff; }
        .title-story { color: #bb00ff; }
        .title-vlog { color: #ff9500; }
        .title-admin { color: #ffffff; }
        .title-spend { color: #ff2d55; }

        /* --- EXCLUSIVE SINGLE ROW CONTAINER --- */
        .grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        /* --- PREMIUM CINEMATIC BUTTONS --- */
        button {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            color: rgba(255, 255, 255, 0.85);
            padding: 18px 24px;
            border-radius: 18px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            box-sizing: border-box;
            transition: background 0.3s, border-color 0.3s, transform 0.3s, box-shadow 0.3s;
            position: relative;
            overflow: hidden;
            touch-action: none; /* Allows smooth tracking calculations over system gestures */
        }

        button span.time {
            font-size: 0.8rem;
            color: var(--text-main);
            font-weight: 700;
            background: rgba(255, 255, 255, 0.06);
            padding: 6px 14px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            transition: all 0.3s ease;
        }

        /* --- DRAG SLIDE HOVER TRACKING EFFECTS --- */
        button.tracked-glow {
            background: rgba(30, 30, 45, 0.85) !important;
            border-color: rgba(255, 255, 255, 0.3) !important;
            transform: scale(1.02) translateX(4px);
        }
        
        .btn-gaming.tracked-glow { box-shadow: -6px 0 25px var(--glow-gaming); border-left: 3px solid #00c3ff; }
        .btn-story.tracked-glow { box-shadow: -6px 0 25px var(--glow-story); border-left: 3px solid #bb00ff; }
        .btn-vlog.tracked-glow { box-shadow: -6px 0 25px var(--glow-vlog); border-left: 3px solid #ff9500; }
        .btn-admin.tracked-glow { box-shadow: -6px 0 25px var(--glow-admin); border-left: 3px solid #ffffff; }
        .btn-spend.tracked-glow { box-shadow: -6px 0 25px var(--glow-spend); border-left: 3px solid #ff2d55; }
        .bonus-btn.tracked-glow { box-shadow: -6px 0 25px var(--glow-bonus); border-left: 3px solid #30d158; }

        /* --- STYLE FOR CONFIRMATION MODE --- */
        button.needs-confirm {
            background: rgba(255, 255, 255, 0.15) !important;
            border-color: #ffffff !important;
            animation: blinkState 1s infinite alternate;
        }
        button.needs-confirm span.time {
            background: #ffffff !important;
            color: #000000 !important;
            font-weight: 800;
        }

        @keyframes blinkState {
            0% { opacity: 0.9; }
            100% { opacity: 1; box-shadow: 0 0 15px rgba(255,255,255,0.1); }
        }

        /* Tactile Push Animation on Actual Press Line */
        button:active {
            transform: scale(0.97) translateX(0px) !important;
        }

        /* Ambient Presets */
        .bonus-btn {
            background: linear-gradient(90deg, rgba(48,209,88,0.06), rgba(18,18,24,0.6));
            border-color: rgba(48,209,88,0.15);
        }
        .bonus-btn span.time { color: #30d158; background: rgba(48,209,88,0.1); border-color: rgba(48,209,88,0.2); }

        .btn-spend {
            background: linear-gradient(90deg, rgba(255,45,85,0.04), rgba(18,18,24,0.6));
            border-color: rgba(255,45,85,0.12);
        }
        .btn-spend span.time { color: #ff2d55; background: rgba(255,45,85,0.1); border-color: rgba(255,45,85,0.2); }

        @keyframes slideDown { to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeUp { to { transform: translateY(0); opacity: 1; } }

        @media (max-width: 480px) {
            body { padding-top: 155px; padding-left: 12px; padding-right: 12px; }
            .bucket-container h1 { font-size: 2.8rem; }
            button { padding: 16px 18px; font-size: 0.95rem; }
        }
    </style>
</head>
<body>

    <div class="header-pin">
        <div class="bucket-container">
            <h2>Available</h2>
            <h1 id="scoreDisplay">0h 0m</h1>
        </div>
    </div>

    <div class="section-wrapper">
        <div class="section-title title-gaming">ZEUTOS</div>
        <div class="grid">
            <button class="btn-gaming" data-label="R&D" data-time="+30m" onclick="handleTap(this, 'add', 30)">R&D <span class="time">+30m</span></button>
            <button class="btn-gaming" data-label="Mod & Setup" data-time="+30m" onclick="handleTap(this, 'add', 30)">Mod & Setup <span class="time">+30m</span></button>
            <button class="btn-gaming" data-label="Script-Outline" data-time="+45m" onclick="handleTap(this, 'add', 45)">Script-Outline <span class="time">+45m</span></button>
            <button class="btn-gaming" data-label="Recording Session" data-time="+2h" onclick="handleTap(this, 'add', 120)">Recording Session <span class="time">+2h</span></button>
            <button class="btn-gaming" data-label="Timeline Cut" data-time="+2h" onclick="handleTap(this, 'add', 120)">Timeline Cut <span class="time">+2h</span></button>
            <button class="btn-gaming" data-label="SFX & Visuals" data-time="+2h" onclick="handleTap(this, 'add', 120)">SFX & Visuals <span class="time">+2h</span></button>
            <button class="btn-gaming" data-label="Thumbnail-Seo-Upload" data-time="+45m" onclick="handleTap(this, 'add', 45)">Thumbnail-Seo-Upload <span class="time">+45m</span></button>
        </div>
    </div>

    <div class="section-wrapper">
        <div class="section-title title-story">A Missing Chapter</div>
        <div class="grid">
            <button class="btn-story" data-label="R&D-Story" data-time="+1h" onclick="handleTap(this, 'add', 60)">R&D-Story <span class="time">+1h</span></button>
            <button class="btn-story" data-label="Scripting" data-time="+2h" onclick="handleTap(this, 'add', 120)">Scripting <span class="time">+2h</span></button>
            <button class="btn-story" data-label="Recording/day" data-time="+1h" onclick="handleTap(this, 'add', 60)">Recording/day <span class="time">+1h</span></button>
            <button class="btn-story" data-label="Timeline Cut" data-time="+2h" onclick="handleTap(this, 'add', 120)">Timeline Cut <span class="time">+2h</span></button>
        </div>
    </div>

    <div class="section-wrapper">
        <div class="section-title title-vlog">Coming PRJ</div>
        <div class="grid">
            <button class="btn-vlog" data-label="R&D" data-time="+1h" onclick="handleTap(this, 'add', 60)">R&D <span class="time">+1h</span></button>
            <button class="btn-vlog" data-label="Gear Prep" data-time="+30m" onclick="handleTap(this, 'add', 30)">Gear Prep <span class="time">+30m</span></button>
            <button class="btn-vlog" data-label="Shoot" data-time="+3h" onclick="handleTap(this, 'add', 180)">Shoot <span class="time">+3h</span></button>
            <button class="btn-vlog" data-label="Timeline Cut" data-time="+2h" onclick="handleTap(this, 'add', 120)">Timeline Cut <span class="time">+2h</span></button>
            <button class="btn-vlog" data-label="SFX & Visuals" data-time="+2h" onclick="handleTap(this, 'add', 120)">SFX & Visuals <span class="time">+2h</span></button>
        </div>
    </div>
    
    <div class="section-wrapper">
        <div class="section-title title-admin">Admin</div>
        <div class="grid">
            <button class="btn-admin" data-label="Organizing Things" data-time="+30m" onclick="handleTap(this, 'add', 30)">Organizing Things <span class="time">+30m</span></button>
            <button class="btn-admin" data-label="Pure Uninterrupted work" data-time="+45m" onclick="handleTap(this, 'add', 45)">Pure Uninterrupted work <span class="time">+45m</span></button>
        </div>
    </div>

    <div class="section-wrapper">
        <div class="section-title title-spend" style="margin-top: 40px;">Rewards & Spending</div>
        <div class="grid">
            <button class="bonus-btn" data-label="FINAL VIDEO EXPORT" data-time="+2h" onclick="handleTap(this, 'add', 120)">FINAL VIDEO EXPORT <span class="time">+2h</span></button>
            <button class="btn-spend" data-label="1Ep" data-time="-1h" onclick="handleTap(this, 'subtract', 60)">1Ep <span class="time">-1h</span></button>
            <button class="btn-spend" data-label="YT" data-time="-30m" onclick="handleTap(this, 'subtract', 30)">YT <span class="time">-30m</span></button>
            <button class="btn-spend" data-label=":(" data-time="-3h" onclick="handleTap(this, 'subtract', 180)">:( <span class="time">-3h</span></button>
        </div>
    </div>

    <script>
        let totalMinutes = localStorage.getItem("timeBucketPro") ? parseInt(localStorage.getItem("timeBucketPro")) : 0;
        const scoreElement = document.getElementById("scoreDisplay");
        let activeConfirmButton = null;

        function formatTime(mins) {
            let h = Math.floor(mins / 60);
            let m = mins % 60;
            if (h === 0) return `${m}m`;
            if (m === 0) return `${h}h`;
            return `${h}h ${m}m`;
        }

        function updateDisplay(animate = false) {
            scoreElement.innerText = formatTime(totalMinutes);
            localStorage.setItem("timeBucketPro", totalMinutes);
            
            if (animate) {
                scoreElement.classList.remove("pop-animation");
                void scoreElement.offsetWidth;
                scoreElement.classList.add("pop-animation");
                setTimeout(() => scoreElement.classList.remove("pop-animation"), 300);
            }
        }

        // --- TWO-STEP TAP TO CONFIRMATION ARCHITECTURE ---
        function handleTap(button, action, value) {
            // If this button is not primed for confirmation yet
            if (activeConfirmButton !== button) {
                resetConfirmation(); // Clear out any previous active confirm state
                
                activeConfirmButton = button;
                button.classList.add("needs-confirm");
                
                // Dynamically transform text inside button to alert state
                let labelNode = button.childNodes[0];
                if (labelNode.nodeType === Node.TEXT_NODE) {
                    labelNode.textContent = "Confirm Payout? ";
                } else {
                    button.innerHTML = `Confirm Payout? <span class="time">${button.getAttribute('data-time')}</span>`;
                }
                
                if (navigator.vibrate) navigator.vibrate(20);
                return;
            }

            // Executed on SECOND click
            if (action === 'add') {
                totalMinutes += value;
                if (navigator.vibrate) navigator.vibrate(50);
                updateDisplay(true);
            } else if (action === 'subtract') {
                if (totalMinutes >= value) {
                    totalMinutes -= value;
                    if (navigator.vibrate) navigator.vibrate([30, 50, 30]);
                    scoreElement.style.color = "#ff2d55";
                    updateDisplay(true);
                    setTimeout(() => { scoreElement.style.color = "var(--text-main)"; }, 300);
                } else {
                    if (navigator.vibrate) navigator.vibrate(200);
                    scoreElement.style.transform = "translateX(-10px)";
                    setTimeout(() => scoreElement.style.transform = "translateX(10px)", 50);
                    setTimeout(() => scoreElement.style.transform = "translateX(-10px)", 100);
                    setTimeout(() => scoreElement.style.transform = "translateX(10px)", 150);
                    setTimeout(() => scoreElement.style.transform = "translateX(0)", 200);
                }
            }
            resetConfirmation();
        }

        function resetConfirmation() {
            if (activeConfirmButton) {
                let origLabel = activeConfirmButton.getAttribute("data-label");
                let origTime = activeConfirmButton.getAttribute("data-time");
                activeConfirmButton.innerHTML = `${origLabel} <span class="time">${origTime}</span>`;
                activeConfirmButton.classList.remove("needs-confirm");
                activeConfirmButton = null;
            }
        }

        // Cancel configuration checks when clicking general empty backgrounds
        document.addEventListener("pointerdown", function(e) {
            if (!e.target.closest("button")) {
                resetConfirmation();
            }
        });

        // --- CONTINUOUS FINGER SLIDE HIT-DETECTION MONITOR ---
        function runTouchTracker(e) {
            // Extract finger location matrix points
            let touch = e.touches[0];
            let targetEl = document.elementFromPoint(touch.clientX, touch.clientY);
            
            // Clean out current highlights across the layout
            document.querySelectorAll("button").forEach(btn => btn.classList.remove("tracked-glow"));
            
            // Apply glow if finger is over a tracker point target box
            if (targetEl) {
                let buttonParent = targetEl.closest("button");
                if (buttonParent) {
                    buttonParent.classList.add("tracked-glow");
                }
            }
        }

        document.addEventListener("touchmove", runTouchTracker, { passive: true });
        document.addEventListener("touchend", () => {
            document.querySelectorAll("button").forEach(btn => btn.classList.remove("tracked-glow"));
        });

        updateDisplay(false);
    </script>
</body>
</html>
